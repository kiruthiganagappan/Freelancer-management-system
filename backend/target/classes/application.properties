server.port=8080

# ===== MySQL Configuration =====
spring.datasource.url=jdbc:mysql://localhost:3306/freelancer_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== JWT Configuration =====
# 256-bit+ secret, base64 or plain - change this in production
jwt.secret=ThisIsASecretKeyForFreelancerManagementSystemJWTAuthProject2026ChangeMe
jwt.expiration.ms=86400000

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173

# ===== Logging =====
logging.level.org.springframework.security=INFO
